<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pomodoro Timer by ZeroKoma">
    <title>Pomodoro Timer by ZeroKoma</title>
    <link rel="icon" type="image/x-icon" href="imgs/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css"> 
</head>
<body class="container bg-dark text-light d-flex flex-column justify-content-center align-items-center">
    <div class="video-background">
        <div id="yt-background"></div>
    </div>
   
    <div id="draggable" class="content">
        <div id="display-panel">
            <div class="d-flex flex-column align-items-center">
                <div class="d-flex justify-content-center align-items-center">
                    <img width="25" height="25"  alt="Pomodoro icon" src="imgs/favicon.png"/>
                    <h1 id="timerLabel" class="ms-3">Pomodoro Timer</h1>
                </div>
                <span class="author">by ZeroKoma</span>
                
                <h2 id="time" class="mt-2">25:00</h2>

                <div class="separator"></div>
                
                <div class="btn-group mt-2">
                    <button id="start" class="btn btn-secondary px-4" title="Start">
                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16">
                            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                        </svg>
                    </button>
                    <button id="pause" class="btn btn-secondary px-4" title="Pause">
                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-pause-fill" viewBox="0 0 16 16">
                            <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>
                        </svg>
                    </button>
                    <button id="stop" class="btn btn-secondary px-4 active" title="Stop">
                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-stop-fill" viewBox="0 0 16 16">
                            <path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5z"/>
                        </svg>
                    </button>
                </div>
                <div class="d-flex align-items-center justify-content-around pt-2">
                <div id="cycleDisplay" class="d-flex justify-content-center align-items-center d-none">
                    <p id="cycleValue" class="cycle mb-1 me-1"></p>
                    <span class="mb-1">&nbsp;-&nbsp;</span>
                </div>
                <div class="fw-light end-time">
                    <div class="col-12 d-flex justify-content-center align-items-center">
                        <p class="mb-1 ms-1">End Time:</p>
                        <p class="ms-1 mb-1" id="endTimeValue">-- : --</p>
                    </div>
                </div>
                </div>
            </div>
        </div>
    
        <div id="sliders-time-panel" class="fw-light fs-14 hidden-box">
            <div class="d-flex flex-column align-items-center justify-content-center">
                <div class="separator"></div>
                <div class="options-container text-center">
                    <div class="mb-2">
                        <span class="me-3">Focus Time:</span>
                        <div class="d-flex justify-content-center align-items-center">
                            <input type="range" id="focusSlider" min="5" max="50" step="5" value="25">
                            <div class="text-light d-flex ms-3">
                                <span id="focusSliderText">25</span>
                                <span>min</span>
                            </div>
                        </div>
                    </div>
                    <div class="mb-2">
                        <span class="me-3">Break Time:</span>
                        <div class="d-flex justify-content-center align-items-center">
                            <input type="range" id="breakSlider" min="5" max="30" step="5" value="5">
                            <div class="text-light d-flex ms-3">
                                <span id="breakSliderText">5</span>
                                <span>min</span>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>

        <div id="toggle-volume-panel-button" class="d-flex flex-column justify-content-center align-items-center">
            <div class="separator"></div>
            <div class="d-flex flex-row justify-content-center align-items-center cursor-pointer">
                <div class="me-3" title="Toggle Volumen Panel">Sound Panel:</div>

                    <title>Toggle Volumen Panel</title>
                    </svg>  
                </svg>
            </div>
        </div>

        <div id="sliders-volume-panel" class="fw-light fs-14 hidden-box hidden">

                <div class="options-container">
                    <div class="mt-2 mb-2 pt-2 d-flex flex-column justify-content-center align-items-center">
                        <span class="me-3">Tick tock Volume:</span>
                        <div class="d-flex">
                            <input type="range" id="tickTockSlider" min="0" max="100" step="5" value="0">
                            <div class="text-light ms-3">
                                <span id="tickTockSliderText">0</span>
                                <span class="ms-1">%</span>
                            </div>
                        </div>

                    <div class="mb-3">
                        <span class="me-3">Background Volume:</span>
                        <div class="d-flex">
                            <input type="range" id="backgroundSlider" min="0" max="100" step="5" value="0">
                            <div class="text-light d-flex ms-3">
                                <span id="backgroundSliderText">0</span>
                                <span class="ms-1">%</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-2">
                        <span class="me-3">Video Background Volume:</span>
                        <div class="d-flex">
                            <input type="range" id="videoBackgroundSlider" min="0" max="100" step="5" value="10">
                            <div class="text-light d-flex ms-3">
                                <span id="videoBackgroundSliderText">10</span>
                                <span class="ms-1">%</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <span class="me-3">Alarm Volume:</span>
                        <div class="d-flex">
                            <input type="range" id="alarmSlider" min="0" max="100" step="5" value="10">
                            <div class="text-light d-flex ms-3">
                                <span id="alarmSliderText">10</span>
                                <span class="ms-1">%</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="d-flex flex-column justify-content-center align-items-center">
            <div class="separator"></div>
            <div class="d-flex flex-row justify-content-center align-items-center">
                <div class="form-check form-switch me-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="video-toggle-switch" checked>
                    <label class="form-check-label ms-2 cursor-pointer" id="video-toggle-label" title="Manage Youtube Playlist">Background Video:</label>
                </div>
                <div id="change-video-url-panel-button" class="cursor-pointer" title="Manage Youtube Playlist">
                    <svg width="30px" height="30px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
